<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte __TITLE__</title>
<style>
:root {
  --bg: #fbfbf8; --panel: #f1f0ea; --text: #24292f; --faint: #8a8a82; --line: #e0ded5;
  --head: #8a5a00; --op: #0a7a4b; --ctl: #a12a6f; --reg: #6a3fc0; --hard: #b2361f;
  --num: #1f5fbf; --mem: #b05c00; --lab: #0b7285; --src-bg: #fff6d6; --hl: #ffe08a;
  --add: #e3f5e1; --del: #fbe4e1; --chg: #e3edff; --add-t: #1a7f37;
  --del-t: #c0392b; --chg-t: #1f5fbf; --sel: #1f5fbf;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16171a; --panel: #1e2024; --text: #d8dae0; --faint: #7c808a; --line: #2c2f35;
    --head: #e3b45b; --op: #5fd39a; --ctl: #f07ac0; --reg: #b9a0ff; --hard: #ff8a70;
    --num: #7fb2ff; --mem: #ffb067; --lab: #5fd0e0; --src-bg: #2a2716; --hl: #5a4a10;
    --add: #15301c; --del: #3a1a17; --chg: #16263f; --add-t: #6fdc8c;
    --del-t: #ff8a80; --chg-t: #7fb2ff; --sel: #7fb2ff;
  }
}
:root[data-theme="dark"] {
  --bg: #16171a; --panel: #1e2024; --text: #d8dae0; --faint: #7c808a; --line: #2c2f35;
  --head: #e3b45b; --op: #5fd39a; --ctl: #f07ac0; --reg: #b9a0ff; --hard: #ff8a70;
  --num: #7fb2ff; --mem: #ffb067; --lab: #5fd0e0; --src-bg: #2a2716; --hl: #5a4a10;
  --add: #15301c; --del: #3a1a17; --chg: #16263f; --add-t: #6fdc8c;
  --del-t: #ff8a80; --chg-t: #7fb2ff; --sel: #7fb2ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, sans-serif; }
code, .mono { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 13px; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel);
  border-bottom: 1px solid var(--line); padding: 5px 12px; display: flex;
  gap: 10px; align-items: center; white-space: nowrap; overflow-x: auto; }
header b { font-size: 14px; }
select, button, label { font: inherit; font-size: 13px; }
.tabs { display: flex; gap: 2px; }
.tabs button, .nav button { border: 1px solid var(--line); background: var(--bg);
  color: var(--text); border-radius: 5px; padding: 1px 10px; cursor: pointer; }
.tabs button.on { background: var(--head); color: var(--bg); border-color: var(--head); }
.nav { display: flex; gap: 6px; align-items: center; }
.nav button { padding: 1px 6px; }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
main { padding: 4px 12px 48px; min-width: 0; }
aside { border-left: 1px solid var(--line); background: var(--panel); padding: 10px 12px;
  position: sticky; top: var(--hdr, 36px); align-self: start;
  height: calc(100vh - var(--hdr, 36px)); overflow: auto; }
aside h2 { font-size: 15px; margin: 0 0 6px; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--faint); margin: 12px 0 4px; }
aside p { margin: 4px 0; }
aside .x { float: right; color: var(--faint); cursor: pointer; text-decoration: none; }
aside .code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 6px; margin: 4px 0; white-space: pre-wrap; }
.steps { margin: 4px 0; padding-left: 20px; }
.steps li { margin: 3px 0; }
.box { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; margin: 8px 0; }
.box.mine { border-color: var(--sel); }
.box.fix { border-color: var(--add-t); }
.box .t { font-weight: 600; }
.faint, .empty { color: var(--faint); }
a.act { color: var(--lab); cursor: pointer; }
.row { white-space: pre; padding: 0 4px; border-radius: 3px; }
.row.src { background: var(--src-bg); margin-top: 3px; }
.ln { color: var(--faint); display: inline-block; min-width: 3.2em; user-select: none; }
.code .row.out { opacity: .4; }
.code .row.fn { cursor: pointer; }
.code .row.fn .ln { color: var(--head); }
.insn { cursor: pointer; }
.insn:hover, .code .row.fn:hover { background: var(--panel); }
.sel, .cmp tr.sel td { outline: 2px solid var(--sel); outline-offset: -2px; }
.d-add { background: var(--add); } .d-chg { background: var(--chg); }
.rn, .dim { color: var(--faint); }
.lbl { color: var(--lab); font-weight: 700; }
.kw { color: var(--ctl); font-weight: 600; }
.op { color: var(--op); }
.r { color: var(--reg); cursor: pointer; } .hr { color: var(--hard); font-weight: 600; }
.n { color: var(--num); } .sym { color: var(--lab); }
a.lab { color: var(--lab); }
.hl { background: var(--hl); border-radius: 3px; }
.target { outline: 2px solid var(--lab); }
.slot { cursor: pointer; text-decoration: underline dotted; }
/* Everything clickable reacts on hover. */
.r:hover, .slot:hover { background: var(--hl); border-radius: 3px; }
a.lab:hover, a.act:hover { text-decoration: underline; }
aside .x:hover { color: var(--text); }
.tabs button:hover, .nav button:hover { border-color: var(--head); }
.tabs button.on:hover { filter: brightness(1.1); }
summary, label { cursor: pointer; } summary:hover, label:hover { color: var(--text); }
select { cursor: pointer; } select:hover { border-color: var(--head); }
table { border-collapse: collapse; }
.cmp { width: 100%; }
.cmp td { padding: 0 6px 0 0; white-space: pre; }
.cmp tr { cursor: pointer; }
.cmp tr:hover td { background: var(--panel); }
.cmp td.mk { width: 1.2em; font-weight: 700; text-align: center; }
.cmp td.no { color: var(--faint); text-align: right; width: 2.6em; user-select: none; }
.cmp td.lt { border-right: 1px solid var(--line); }
.cmp th { text-align: left; font: 600 12px system-ui, sans-serif; color: var(--faint);
  padding: 2px 6px 2px 0; position: sticky; top: var(--hdr, 36px); background: var(--bg); }
.cmp tr.m-bang td, .cmp tr.m-del td { background: var(--del); }
.cmp tr.m-add td { background: var(--add); } .cmp tr.m-tilde td { background: var(--chg); }
.cmp tr.m-bang .mk, .cmp tr.m-del .mk { color: var(--del-t); }
.cmp tr.m-add .mk { color: var(--add-t); } .cmp tr.m-tilde .mk { color: var(--chg-t); }
.cmp tr.c td { background: var(--src-bg); }
.cmp tr.gap td { color: var(--faint); text-align: center; cursor: default; }
.pre td { padding: 1px 8px 1px 0; white-space: nowrap; }
.pre tr { cursor: pointer; } .pre tr:hover td { background: var(--bg); }
.tab td, .tab th { padding: 1px 12px 1px 0; white-space: nowrap; text-align: left; }
.tab th { font: 600 12px system-ui, sans-serif; color: var(--faint); position: sticky;
  top: var(--hdr, 36px); background: var(--bg); }
.tab .num { text-align: right; color: var(--faint); }
.tab tr[data-x] { cursor: pointer; } .tab tr[data-x]:hover td { background: var(--panel); }
.tab tr.gap td { color: var(--faint); font-style: italic; font-size: 12px; }
.pre-on, .tab tr.pre-on td { background: var(--chg); }
.ok { color: var(--add-t); } .bad { color: var(--del-t); }
@media (max-width: 860px) {
  .wrap { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <b id="file"></b>
  <select id="func" aria-label="Función"></select>
  <div class="tabs" id="tabs"></div>
  <div class="nav" id="nav"></div>
</header>
<div class="wrap">
  <main id="main" class="mono"></main>
  <aside id="side"></aside>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// What each pass does, in a line.
const INTRO = {
  rtl: 'Lo primero que genera el compilador: tu C traducido casi literal.',
  jump: 'Optimiza saltos: borra saltos a saltos y código muerto.',
  cse: 'Reusa cuentas ya hechas dentro de cada bloque.',
  addressof: 'Saca de memoria las variables cuya dirección ya no hace falta.',
  gcse: 'Busca cuentas repetidas en toda la función y las hace una sola vez, ' +
    'guardadas en un pseudo nuevo (tN).',
  loop: 'Saca fuera de los bucles lo que no cambia adentro.',
  cse2: 'Segunda vuelta de cse.',
  flow: 'Calcula qué valor está vivo en cada punto.',
  combine: 'Junta instrucciones vecinas en una sola cuando se puede.',
  regmove: 'Reordena copias para ahorrar movimientos.',
  lreg: 'Da registros del procesador a los valores que viven poco.',
  greg: 'Reparte el resto: cada valor va a un registro o a la pila.',
  jump2: 'Última limpieza de saltos, ya con registros reales.',
  mach: 'Pasadas finales propias de la máquina.',
};
let state = {func: null, view: 'cmp', pass: 'gcse', side: null, only: false, table: false};
try { Object.assign(state, JSON.parse(localStorage.getItem('report2') || '{}')); } catch (e) {}
function save() {
  try { localStorage.setItem('report2', JSON.stringify(state)); } catch (e) {}
}
let sel = null;  // what the panel explains: {kind, ...}

function regNames(func, I) {
  // reg number -> first variable name; later regs with a used name get "_2", "_3"….
  const m = {}, count = {};
  for (const [, name, , where] of ((I || D).names[func] || [])) {
    const r = /^reg (\d+)$/.exec(where);
    if (r && !(r[1] in m)) m[r[1]] = name;
  }
  for (const r in m) {
    const n = m[r];
    count[n] = (count[n] || 0) + 1;
    if (count[n] > 1) m[r] = n + '_' + count[n];
  }
  return m;
}
const homeOf = r => (D.homes[state.func] || {})[r];
const otherSide = () => D.sides.includes(state.side) ? state.side : D.sides[0];

function asmColor(t, side) {
  // "lsls r1, r1, #24 <sym> → 12"; [sp, #N] is clickable.
  return esc(t).replace(/\[sp, #(\d+)\]/g, '\u0001$1\u0002')
    .replace(/^(\S+)/, '<span class="op">$1</span>')
    .replace(/\b(r\d+|sb|sl|fp|ip|sp|lr|pc)\b/g, '<span class="hr">$1</span>')
    .replace(/#(-?\w+)/g, '<span class="n">#$1</span>')
    .replace(/&lt;([^&]*)&gt;/g, '<span class="sym">&lt;$1&gt;</span>')
    .replace(/→ (\S+)/, '<span class="lab">→ $1</span>')
    .replace(/\u0001(\d+)\u0002/g, (m, n) => '<span class="slot" data-off="' + n +
      '" data-side="' + esc(side || '') + '">[sp, #' + n + ']</span>');
}
const offs = t => [...String(t).matchAll(/\[sp, #(\d+)\]/g)].map(m => +m[1]);

// ------------------------------------------------------------------ RTL as C

// RTL is printed as Lisp: "(set (reg 210) (ashift (reg 48) (const_int 24)))". These turn it
// into "t210 = uy << 24". parseRtl builds a tree {c: code, m: mode, a: args}.
function parseRtl(text) {
  const toks = text.match(/"[^"]*"|\{[^}]*\}|[()\[\]]|[^\s()\[\]"{}]+/g) || [];
  let i = 0;
  function node() {
    const t = toks[i++];
    if (t === '(' || t === '[') {
      const close = t === '(' ? ')' : ']';
      let n = {c: '[]', m: '', a: []};
      if (t === '(') {
        const m = /^([^/:]+)((?:\/[^/:]+)*)(?::(\w+))?$/.exec(toks[i++] || '') || [];
        n = {c: m[1] || '?', m: m[3] || '', a: []};
      }
      while (i < toks.length && toks[i] !== close) n.a.push(node());
      i++;
      return n;
    }
    return t;
  }
  return node();
}

const TY = {QI: 'u8', HI: 'u16', SI: 'u32', DI: 'u64'};
const STY = {QI: 's8', HI: 's16', SI: 's32', DI: 's64'};
const BIN = {plus: ['+', 12], minus: ['-', 12], mult: ['*', 13], div: ['/', 13], udiv: ['/', 13],
  mod: ['%', 13], umod: ['%', 13], and: ['&', 8], ior: ['|', 6], xor: ['^', 7], ashift: ['<<', 11],
  ashiftrt: ['>>', 11], lshiftrt: ['>>', 11], eq: ['==', 9], ne: ['!=', 9], lt: ['<', 10],
  le: ['<=', 10], gt: ['>', 10], ge: ['>=', 10], ltu: ['<', 10], leu: ['<=', 10], gtu: ['>', 10],
  geu: ['>=', 10]};
// Unsigned ops: the left operand gets a (u32) cast, as C would need.
const UNS = new Set(['udiv', 'umod', 'lshiftrt', 'ltu', 'leu', 'gtu', 'geu']);
const NOT = {eq: 'ne', ne: 'eq', lt: 'ge', ge: 'lt', le: 'gt', gt: 'le', ltu: 'geu', geu: 'ltu',
  leu: 'gtu', gtu: 'leu'};
const isN = (n, c) => n && typeof n === 'object' && n.c === c;
const par = (x, p) => x.p < p ? '(' + x.h + ')' : x.h;
// Leaf text of a node; symbol_ref's name comes as ("name").
const leaf = n => typeof n === 'object' ? (n.a.length ? leaf(n.a[0]) : n.c) : String(n);
const lab = u => '<a class="lab" href="#u' + esc(u) + '">L' + esc(u) + '</a>';

function ex(n, X) {
  // Expression -> {h: html, p: precedence}.
  if (typeof n !== 'object') return {h: esc(String(n).replace(/^"|"$/g, '')), p: 20};
  const c = n.c, a = n.a;
  if (c === 'reg') {
    if (a.length > 1) return {h: '<span class="hr">' + esc(a[1]) + '</span>', p: 20};
    return {h: '<span class="r" data-r="' + a[0] + '">' +
      esc(X.names[a[0]] || 't' + a[0]) + '</span>', p: 20};
  }
  if (c === 'const_int') {
    const v = +a[0], s = Math.abs(v) >= 256 ? (v < 0 ? '-' : '') + '0x' + Math.abs(v).toString(16) : String(v);
    return {h: '<span class="n">' + s + '</span>', p: 20};
  }
  if (c === 'symbol_ref') return {h: '<span class="sym">' + esc(leaf(a[0]).replace(/"/g, '')) + '</span>', p: 20};
  if (c === 'label_ref') return {h: lab(a[0]), p: 20};
  if (c === 'const') return ex(a[0], X);
  if (c === 'nil') return {h: '', p: 20};
  if (c === 'set') return {h: ex(a[0], X).h + ' = ' + ex(a[1], X).h, p: 1};
  if (c === '[]') return {h: a.map(x => ex(x, X).h).join(', '), p: 20};
  if (c === 'mem') return {h: '*(' + (TY[n.m] || n.m) + ' *)' + par(ex(a[0], X), 15), p: 14};
  if (c === 'zero_extend' || c === 'sign_extend') {
    const from = typeof a[0] === 'object' ? a[0].m : '';
    return {h: '(' + ((c === 'zero_extend' ? TY : STY)[from] || from) + ')' + par(ex(a[0], X), 14), p: 14};
  }
  if (c === 'truncate') return {h: '(' + (TY[n.m] || n.m) + ')' + par(ex(a[0], X), 14), p: 14};
  if (c === 'subreg') {
    const inner = typeof a[0] === 'object' ? a[0].m : '', size = m => ({QI: 1, HI: 2, SI: 4, DI: 8}[m] || 0);
    const x = ex(a[0], X);
    if (size(n.m) >= size(inner)) return x;  // the same value seen in a wider mode
    if (+a[1]) return {h: '(' + TY[n.m] + ')' + '(' + x.h + ' >> ' + 8 * size(n.m) * +a[1] + ')', p: 14};
    return {h: '(' + (TY[n.m] || n.m) + ')' + par(x, 14), p: 14};
  }
  if (c === 'neg' || c === 'not') return {h: (c === 'neg' ? '-' : '~') + par(ex(a[0], X), 14), p: 14};
  if (BIN[c]) {
    let l = a[0], r = a[1];
    if (isN(l, 'cc0') && X.cc) [l, r] = X.cc;  // "cc0 > 0" means "the compared a > b"
    const [op, p] = BIN[c];
    let lh = par(ex(l, X), p);
    if (UNS.has(c)) lh = '(u32)' + par(ex(l, X), 14);
    return {h: lh + ' ' + op + ' ' + par(ex(r, X), p + 1), p};
  }
  if (c === 'if_then_else')
    return {h: par(ex(a[0], X), 4) + ' ? ' + par(ex(a[1], X), 4) + ' : ' + par(ex(a[2], X), 3), p: 3};
  if (c === 'call') {
    const f = isN(a[0], 'mem') ? a[0].a[0] : a[0];
    return {h: (isN(f, 'symbol_ref') ? ex(f, X).h : '(*' + ex(f, X).h + ')') + '()', p: 15};
  }
  if (c === 'compare') return {h: 'compare(' + ex(a[0], X).h + ', ' + ex(a[1], X).h + ')', p: 15};
  if (c === 'cc0') return {h: 'cc', p: 20};
  if (c === 'pc') return {h: 'pc', p: 20};
  return {h: esc(c) + '(' + a.map(x => ex(x, X).h).join(', ') + ')', p: 15};
}

function st(n, X) {
  // Statement (an insn's pattern) -> html.
  if (typeof n !== 'object') return esc(String(n));
  const c = n.c, a = n.a;
  if (c === 'set') {
    const [d, s] = a;
    if (isN(d, 'pc')) {
      if (isN(s, 'label_ref')) return '<span class="kw">goto</span> ' + lab(s.a[0]);
      if (isN(s, 'if_then_else')) {
        let [cond, t, e] = s.a;
        if (isN(t, 'pc') && NOT[cond.c]) { cond = {...cond, c: NOT[cond.c]}; t = e; }
        return '<span class="kw">if</span> (' + ex(cond, X).h + ') <span class="kw">goto</span> ' +
          (isN(t, 'label_ref') ? lab(t.a[0]) : ex(t, X).h);
      }
      return '<span class="kw">goto</span> *' + ex(s, X).h;
    }
    if (isN(d, 'cc0')) {
      // Thumb compares set the condition codes; the jump after uses them.
      X.cc = isN(s, 'compare') ? s.a : [s, '0'];
      return '<span class="dim">compara</span> ' + ex(X.cc[0], X).h + ' <span class="dim">con</span> ' + ex(X.cc[1], X).h;
    }
    return ex(d, X).h + ' = ' + ex(s, X).h;
  }
  if (c === 'parallel') return (a[0].a || []).map(x => st(x, X)).join('; ');
  if (c === 'clobber' || c === 'use') return '<span class="dim">' + (c === 'use' ? 'usa' : 'pisa') + ' ' + ex(a[0], X).h + '</span>';
  if (c === 'return') return '<span class="kw">return</span>';
  if (c === 'addr_vec' || c === 'addr_diff_vec') {
    const v = c === 'addr_vec' ? a[0] : a[1];
    return '<span class="kw">tabla</span> ' + (v.a || []).map(x => ex(x, X).h).join(', ');
  }
  if (c === 'asm_input') return 'asm(' + esc(a[0]) + ')';
  return ex(n, X).h;
}

const RN = {REG_DEAD: 'último uso de', REG_UNUSED: 'no se usa', REG_EQUAL: 'vale', REG_EQUIV: 'vale siempre',
  REG_LABEL: 'usa', REG_INC: 'incrementa', REG_NONNEG: 'nunca negativo:'};

function insnC(text, X) {
  // "(insn 651 650 652 (set ...) 39 {ashlsi3} (nil) (expr_list:REG_DEAD ...))"
  // -> {kind, uid, h: statement, notes: [html]}.
  const n = parseRtl(text);
  if (typeof n !== 'object') return {kind: '?', h: esc(text), notes: []};
  const uid = n.a[0];
  if (n.c === 'code_label') return {kind: 'label', uid, h: '<span class="lbl">L' + esc(uid) + ':</span>', notes: []};
  if (!/insn$/.test(n.c)) return {kind: n.c, uid, h: '', notes: []};
  const notes = [];
  const h = st(n.a[3], X);
  for (const x of n.a.slice(4))
    for (let k = x; isN(k, 'expr_list') || isN(k, 'insn_list'); k = k.a[1])
      if (/^REG_/.test(k.m)) notes.push((RN[k.m] || k.m.slice(4).toLowerCase()) + ' ' +
        (isN(k, 'insn_list') ? 'insn ' + esc(k.a[0]) : ex(k.a[0], X).h));
  return {kind: 'insn', uid, h, notes};
}

// An insn's text without its uid/prev/next, to tell whether a pass changed it.
const body = t => t.replace(/^\((\S+) \d+ \d+ \d+/, '($1').replace(/\s+/g, ' ');
const cline = n => esc((D.source[n - 1] || '').trim());

// ------------------------------------------------------------------ why a slot

const ord = n => n + 'ª';
// Insn counts that give an expression table of `size` buckets (n / 2 | 1).
const insnRange = size => (2 * size - 2) + '–' + (2 * size + 1);

function slotFacts(side, off) {
  // What lives at sp+off on one side ('' = yours) and why. Null if there's no data.
  const f = state.func;
  if (side === 'original' && !D.orig_from[f]) return null;
  const I = side ? (D.info || {})[side] : {names: D.names, homes: D.homes, gcse: D.gcse};
  if (!I) return null;
  const homes = I.homes[f] || {}, names = regNames(f, I);
  const r = Object.keys(homes).find(k => homes[k] === 'sp+' + off);
  const F = {off, r, from: side === 'original' ? D.orig_from[f] : null};
  if (!r) return F;
  if (names[r]) return {...F, name: names[r]};
  const g = (I.gcse || {})[f], rows = g ? g.rows : [];
  const k = rows.findIndex(e => e.reg === r);
  if (k < 0) return F;
  return {...F, e: rows[k], k, n: rows.length, size: g.size, X: {names, cc: null},
    first: Math.min(...rows.map(x => +(homes[x.reg] || 'sp+1e9').slice(3)))};
}

function sideSteps(F, title, mine) {
  // One side's chain: C value -> gcse table bucket -> order -> stack slot.
  let h = '<div class="box' + (mine ? ' mine' : '') + '"><div class="t">' + title +
    ': sp+' + F.off + '</div>';
  if (F.from) h += '<p class="faint">Datos del C de ' + esc(F.from) + ', que da este mismo asm.</p>';
  if (!F.r) return h + '<p class="faint">Nada guardado ahí.</p></div>';
  const t = mine ? '<span class="r" data-r="' + F.r + '">t' + F.r + '</span>' : 't' + F.r;
  if (F.name) return h + '<p>Guarda la variable <code>' + esc(F.name) + '</code>.</p></div>';
  if (!F.e) return h + '<p>Guarda ' + t + ', un pseudo sin nombre.</p></div>';
  return h + '<ol class="steps">' +
    '<li>gcse calcula una vez la cuenta <code>' + ex(parseRtl(F.e.expr), F.X).h + '</code> y la guarda en el pseudo ' + t + '.</li>' +
    '<li>Su tabla tiene <b>' + F.size + '</b> casilleros (sale de ' + insnRange(F.size) +
      ' insns). La cuenta cae en el <b>' + F.e.hash + '</b>.</li>' +
    '<li>En orden de casillero es la <b>' + ord(F.k + 1) + ' de ' + F.n + '</b>.</li>' +
    '<li>Las ' + F.n + ' van a la pila en ese orden desde sp+' + F.first + ' → <b>sp+' + F.off +
      '</b>.</li></ol>' +
    (mine ? '<p><a class="act" data-see="' + F.r + '">ver t' + F.r + ' en gcse</a></p>' : '') + '</div>';
}

function explainSlots(oOff, mOff) {
  // Original's slot vs yours, and what it takes to make them equal.
  const side = otherSide();
  const O = oOff != null ? slotFacts(side, oOff) : null, M = mOff != null ? slotFacts('', mOff) : null;
  let h = '';
  if (M) h += sideSteps(M, 'Tuyo', true);
  if (oOff != null) h += O ? sideSteps(O, esc(side)) :
    '<div class="box"><div class="t">' + esc(side) + ': sp+' + oOff + '</div><p class="faint">Sin datos: ' +
    'es asm, y ningún C conocido da el mismo asm.</p></div>';
  if (O && M && O.size && M.size && O.size !== M.size) {
    const d = M.size - O.size;
    h += '<div class="box fix"><div class="t">Para que quede igual</div><p>Hacen falta ' + O.size +
      ' casilleros: ' + insnRange(O.size) + ' insns al empezar gcse. Te ' + (d > 0 ? 'sobran' : 'faltan') +
      ' unas <b>' + Math.abs(2 * d) + ' insns</b>.</p></div>';
  } else if (O && M && O.off === M.off) h += '<p class="ok">Mismo lugar en los dos.</p>';
  return h;
}

// ------------------------------------------------------------------ Comparar

const MK = {' ': '', '~': 'm-tilde', '!': 'm-bang', '-': 'm-del', '+': 'm-add'};
const MEAN = {' ': 'Igual en los dos.', '~': 'Misma instrucción, distinto registro u offset.',
  '!': 'Instrucción distinta.', '-': 'Sólo en el original.', '+': 'Sólo en el tuyo.'};
const cmpData = () => D.cmp[otherSide()][state.func];

function viewCmp() {
  const side = otherSide(), rows = cmpData().rows, keep = new Set();
  // All rows, or only changes with 2 rows around.
  rows.forEach((r, i) => {
    if (!state.only || r[0] !== ' ') for (let k = i - 2; k <= i + 2; k++) keep.add(k);
  });
  let h = '<table class="cmp"><thead><tr><th></th><th></th><th>' + esc(side) +
    '</th><th></th><th>tuyo</th></tr></thead><tbody>';
  let line = -1, gap = false;
  rows.forEach((r, i) => {
    if (!keep.has(i)) {
      if (!gap) h += '<tr class="gap"><td colspan="5">⋯</td></tr>';
      gap = true; return;
    }
    gap = false;
    if (r[5] && r[5] !== line) {
      h += '<tr class="c" data-line="' + r[5] + '"><td></td><td class="no">' + r[5] +
        '</td><td colspan="3">' + cline(r[5]) + '</td></tr>';
      line = r[5];
    }
    h += '<tr class="' + MK[r[0]] + '" data-i="' + i + '"><td class="mk">' + esc(r[0]) +
      '</td><td class="no">' + r[1] + '</td><td class="lt">' + asmColor(r[3], side) +
      '</td><td class="no">' + r[2] + '</td><td>' + asmColor(r[4]) + '</td></tr>';
  });
  return h + '</tbody></table>';
}

function slotPairs() {
  // Rows where the two sides use different stack slots: "orig→mine" -> [rows].
  const pairs = {};
  cmpData().rows.forEach((r, i) => {
    const a = offs(r[3]), b = offs(r[4]);
    a.forEach((o, k) => {
      if (b[k] != null && b[k] !== o) (pairs[o + '→' + b[k]] = pairs[o + '→' + b[k]] || []).push(i);
    });
  });
  return pairs;
}

function panelCmp() {
  const s = cmpData().summary, side = otherSide();
  let h = '<h2>' + (s.differ ? '<span class="bad">' + s.differ + ' líneas distintas</span>' :
    '<span class="ok">Igual</span>') + '</h2>';
  if (s.differ) h += '<p>' + s.logic + ' de lógica; el resto, registros u offsets.</p>';
  h += '<p class="faint">Pila: ' + s.frame[0] + ' bytes en ' + esc(side) + ', ' + s.frame[1] + ' en el tuyo.</p>';
  const pairs = Object.entries(slotPairs());
  if (pairs.length) {
    h += '<h3>Lugares de pila que no coinciden</h3><table class="pre"><tbody>';
    for (const [k, is] of pairs) {
      const [o, m] = k.split('→');
      h += '<tr data-i="' + is[0] + '"><td>' + esc(side) + ' sp+' + o + '</td><td>→</td><td>tuyo <b>sp+' + m +
        '</b></td><td class="faint">' + is.length + ' veces</td></tr>';
    }
    h += '</tbody></table>';
  }
  return h + '<h3>Cómo leer</h3><p><b class="bad">!</b> distinta · <b style="color:var(--chg-t)">~</b> ' +
    'sólo registros u offsets · <b>−/+</b> sobra de un lado.</p>' +
    '<p class="faint">Clic en una fila o en un <span class="slot">[sp, #N]</span> para ver por qué.</p>';
}

function panelRow(i) {
  const r = cmpData().rows[i], side = otherSide();
  let h = '<a class="x" data-clear>✕</a>';
  if (r[5]) h += '<h2>Línea ' + r[5] + '</h2><div class="code">' + cline(r[5]) + '</div>';
  h += '<p>' + MEAN[r[0]] + '</p><table class="pre"><tbody>' +
    '<tr><td class="faint">' + esc(side) + '</td><td>' + asmColor(r[3], side) + '</td></tr>' +
    '<tr><td class="faint">tuyo</td><td>' + asmColor(r[4]) + '</td></tr></tbody></table>';
  const a = offs(r[3]), b = offs(r[4]);
  for (let k = 0; k < Math.max(a.length, b.length); k++) h += explainSlots(a[k], b[k]);
  return h;
}

// ------------------------------------------------------------------ Pasadas

function prevPass(k) {
  for (let j = k - 1; j >= 0; j--) if ((D.dumps[D.passes[j]] || {})[state.func]) return D.passes[j];
  return null;
}

let passInfo = {};  // uid -> {text, old}, for the panel

function viewPass() {
  const pass = state.pass, func = state.func, names = regNames(func);
  const items = (D.dumps[pass] || {})[func] || [];
  if (!items.length) return '<p class="faint">Esta pasada no tiene volcado para esta función.</p>';
  const prev = prevPass(D.passes.indexOf(pass)), before = {};
  if (prev) for (const it of D.dumps[prev][func]) if (it[0] === 'i') before[it[2]] = it[3];
  const X = {names, cc: null};
  passInfo = {added: 0, changed: 0, gone: [], prev, before};
  let h = '', line = -1;
  for (const it of items) {
    if (it[0] === 'l') {
      // Several insns in a row can come from the same C line: show it once.
      if (it[1] === D.src && it[2] !== line)
        h += '<div class="row src" data-line="' + it[2] + '"><span class="ln">' + it[2] + '</span>' +
          cline(it[2]) + '</div>';
      line = it[2];
    } else if (it[0] === 'i') {
      const c = insnC(it[3], X);
      if (c.kind !== 'insn' && c.kind !== 'label') continue;
      let cls = '';
      if (prev && c.kind === 'insn') {
        if (!(it[2] in before)) { cls = ' d-add'; passInfo.added++; }
        else if (body(before[it[2]]) !== body(it[3])) { cls = ' d-chg'; passInfo.changed++; }
      }
      passInfo[it[2]] = it[3];
      h += '<div class="row insn' + cls + '" id="u' + it[2] + '" data-u="' + it[2] + '"><span class="ln">' +
        it[2] + '</span>' + c.h + '</div>';
    }
  }
  const seen = new Set(items.filter(it => it[0] === 'i').map(it => it[2]));
  passInfo.gone = Object.keys(before).filter(u => !seen.has(u));
  return h;
}

// ------------------------------------------------------------------ gcse's table of sums

function exprTable() {
  // gcse's "Expression hash table": {size, rows: [{index, hash, expr}]}, or null.
  const items = (D.dumps.gcse || {})[state.func] || [];
  const k = items.findIndex(it => it[0] === 't' && /^Expression hash table/.test(it[1]));
  if (k < 0) return null;
  const size = +/\((\d+) buckets/.exec(items[k][1])[1], rows = [];
  for (let j = k + 1; j < items.length; j++) {
    const it = items[j], m = it[0] === 't' && /^Index (\d+) \(hash value (\d+)\)/.exec(it[1]);
    if (m) rows.push({index: +m[1], hash: +m[2], expr: (items[j + 1] || [])[1] || ''});
    else if (it[0] === 't' && it[1].trim()) break;
  }
  return {size, rows};
}

function viewTable() {
  const T = exprTable();
  if (!T) return '<p class="faint">No hay tabla para esta función.</p>';
  const X = {names: regNames(state.func), cc: null}, pre = {};
  for (const e of (D.gcse[state.func] || {rows: []}).rows) pre[e.index] = e;
  const rows = [...T.rows].sort((a, b) => a.hash - b.hash || a.index - b.index);
  let h = '<table class="tab"><thead><tr><th class="num">casillero</th><th>cuenta</th>' +
    '<th>guardada en</th></tr></thead><tbody>', last = -1;
  for (const e of rows) {
    // Empty buckets between two used ones: one faint row.
    if (e.hash > last + 1) h += '<tr class="gap"><td class="num">' + (last + 1) +
      (e.hash - 1 > last + 1 ? '–' + (e.hash - 1) : '') + '</td><td colspan="2">vacío</td></tr>';
    const p = pre[e.index];
    h += '<tr class="' + (p ? 'pre-on' : '') + '" data-x="' + e.index + '"><td class="num">' +
      (e.hash === last ? '' : e.hash) + '</td><td>' + ex(parseRtl(e.expr.trim()), X).h + '</td><td>' +
      (p ? '<span class="r" data-r="' + p.reg + '">t' + p.reg + '</span> · ' + esc(homeOf(p.reg) || '') : '') +
      '</td></tr>';
    last = e.hash;
  }
  if (last < T.size - 1) h += '<tr class="gap"><td class="num">' + (last + 1) + '–' + (T.size - 1) +
    '</td><td colspan="2">vacío</td></tr>';
  return h + '</tbody></table>';
}

function panelTable() {
  const T = exprTable(), g = D.gcse[state.func];
  if (!T) return '<h2>Tabla de cuentas</h2>';
  const n = g ? g.rows.length : 0;
  return '<h2>Tabla de cuentas de gcse</h2>' +
    '<p>gcse anota cada cuenta de la función (<code>uy &lt;&lt; 24</code>, <code>map + 2</code>…) ' +
    'una sola vez, aunque aparezca muchas veces.</p>' +
    '<p>Esta tiene <b>' + T.size + '</b> casilleros y ' + T.rows.length + ' cuentas distintas.</p>' +
    '<p>Cada cuenta va al casillero que le toca según su contenido. Dos pueden caer en el mismo.</p>' +
    (n ? '<p>Las ' + n + ' <span class="pre-on">&nbsp;marcadas&nbsp;</span> son las que gcse calcula una vez y guarda en un ' +
      'pseudo nuevo. Las recorre de arriba abajo, en orden de casillero.</p>' : '') +
    '<p class="faint">En el volcado crudo se llama "Expression hash table".</p>';
}

function panelExpr(i) {
  const T = exprTable(), e = T.rows.find(r => r.index === +i), X = {names: regNames(state.func), cc: null};
  const p = ((D.gcse[state.func] || {rows: []}).rows).find(r => r.index === +i);
  let h = '<a class="x" data-clear>✕</a><h2>Cuenta ' + esc(i) + '</h2><div class="code">' +
    ex(parseRtl(e.expr.trim()), X).h + '</div><p>Casillero <b>' + e.hash + '</b> de ' + T.size + '.</p>';
  if (!p) return h + '<p class="faint">gcse no la guardó en un pseudo.</p>';
  const home = homeOf(p.reg);
  if (home && /^sp\+/.test(home)) h += sideSteps(slotFacts('', home.slice(3)), 'Guardada', true);
  else h += '<p>La guardó en el pseudo t' + p.reg + ', que termina en ' + esc(home || 'ningún lado') + '.</p>';
  return h;
}

function panelPass() {
  const p = state.pass, P = passInfo, func = state.func;
  if (p === 'gcse' && state.table) return panelTable();
  let h = '<h2>' + esc(p) + '</h2><p>' + esc(INTRO[p] || '') + '</p>';
  if (P.prev) h += '<p class="faint">Frente a ' + esc(P.prev) + ': <span class="d-add">&nbsp;' + P.added +
    ' nuevas&nbsp;</span> <span class="d-chg">&nbsp;' + P.changed + ' cambiadas&nbsp;</span> ' +
    P.gone.length + ' borradas.</p>';
  const g = D.gcse[func];
  if (p === 'gcse' && g && g.rows.length) {
    const names = regNames(func), X = {names, cc: null};
    h += '<h3>Cuentas que guardó (tabla de ' + g.size + ')</h3><table class="pre"><tbody>' +
      g.rows.map(e => '<tr data-r="' + e.reg + '"><td class="faint">' + e.hash + '</td><td><span class="r" data-r="' +
        e.reg + '">t' + e.reg + '</span> = ' + ex(parseRtl(e.expr), X).h + '</td><td class="faint">' +
        esc(homeOf(e.reg) || '') + '</td></tr>').join('') + '</tbody></table>' +
      '<p class="faint">Columna 1: casillero. Van en ese orden; la última, lugar final.</p>';
  }
  if (P.gone.length) {
    const X = {names: regNames(func), cc: null};
    h += '<details><summary class="faint">Borradas (' + P.gone.length + ')</summary>' +
      P.gone.map(u => '<div class="row"><span class="ln">' + u + '</span>' +
        insnC(P.before[u], X).h + '</div>').join('') + '</details>';
  }
  return h + '<p class="faint">Clic en una instrucción o un valor para ver más.</p>';
}

function panelInsn(u) {
  const X = {names: regNames(state.func), cc: null}, c = insnC(passInfo[u], X);
  let h = '<a class="x" data-clear>✕</a><h2>Instrucción ' + esc(u) + '</h2><div class="code">' + c.h + '</div>';
  if (c.notes.length) h += '<p class="faint">' + c.notes.join('<br>') + '</p>';
  const old = passInfo.before[u];
  if (passInfo.prev && old == null) h += '<p>Nueva en esta pasada.</p>';
  else if (old != null && body(old) !== body(passInfo[u]))
    h += '<p>Antes, en ' + esc(passInfo.prev) + ':</p><div class="code">' + insnC(old, X).h + '</div>';
  const regs = [...new Set([...passInfo[u].matchAll(/\(reg(?:\/\w+)*(?::\w+)? (\d+)\)/g)].map(m => m[1]))];
  if (regs.length) h += '<h3>Dónde termina cada valor</h3><table class="pre"><tbody>' +
    regs.map(r => '<tr data-r="' + r + '"><td>' + ex({c: 'reg', a: [r]}, X).h + '</td><td class="faint">' +
      esc(homeOf(r) || 'eliminado') + '</td></tr>').join('') + '</tbody></table>';
  return h;
}

// ------------------------------------------------------------------ C

function viewC() {
  const [a, b] = D.range[state.func] || [0, 0];
  let h = '<div class="code">';
  D.source.forEach((t, i) => {
    const n = i + 1, fn = n >= a && n <= b;
    h += '<div class="row ' + (fn ? 'fn' : 'out') + '" data-line="' + n + '"' + (n === a ? ' id="fstart"' : '') +
      '><span class="ln">' + n + '</span>' + esc(t) + '</div>';
  });
  return h + '</div>';
}

function panelLine(n) {
  const side = otherSide();
  let h = '<a class="x" data-clear>✕</a><h2>Línea ' + n + '</h2><div class="code">' + cline(n) + '</div>';
  const vars = (D.names[state.func] || []).filter(v => v[2] === n && /^reg \d+$/.test(v[3]));
  if (vars.length) h += '<p>' + vars.map(v => '<code>' + esc(v[1]) + '</code> termina en ' +
    esc(homeOf(v[3].slice(4)) || 'ningún lado')).join('<br>') + '</p>';
  const rows = cmpData().rows.filter(r => r[5] === n);
  if (!rows.length) return h + '<p class="faint">No genera asm.</p>';
  h += '<h3>Su asm</h3><table class="cmp"><tbody>' + rows.map(r => '<tr class="' + MK[r[0]] + '" data-i="' +
    cmpData().rows.indexOf(r) + '"><td class="mk">' + esc(r[0]) + '</td><td class="lt">' + asmColor(r[3], side) +
    '</td><td>' + asmColor(r[4]) + '</td></tr>').join('') + '</tbody></table>' +
    '<p class="faint">Izquierda ' + esc(side) + ', derecha el tuyo. Clic: ver en Comparar.</p>';
  return h;
}

// ------------------------------------------------------------------ values

function panelReg(r) {
  const uses = document.querySelectorAll('main .r[data-r="' + r + '"]');
  const nm = regNames(state.func)[r], home = homeOf(r);
  let h = '<a class="x" data-clear>✕</a><h2>' + esc(nm || 't' + r) + '</h2><p>' +
    (nm ? 'Variable tuya.' : 'Pseudo sin nombre (no es una variable de tu C).') + ' Termina en <b>' +
    esc(home || 'ningún lado (se eliminó)') + '</b>.</p>';
  if (home && /^sp\+/.test(home)) {
    const F = slotFacts('', home.slice(3));
    if (F && F.e) h += sideSteps(F, 'Por qué', true);
  }
  h += '<p>' + uses.length + ' usos en esta vista. ' +
    (uses.length ? '<a class="act" data-next>siguiente ↓</a>' : '') + '</p>';
  return h;
}

// ------------------------------------------------------------------ shell

function hl() {
  for (const e of document.querySelectorAll('.hl, .sel')) e.classList.remove('hl', 'sel');
  if (!sel) return;
  const q = {reg: 'main .r[data-r="' + sel.r + '"]', row: 'main tr[data-i="' + sel.i + '"]',
    insn: 'main [data-u="' + sel.u + '"]', expr: 'main [data-x="' + sel.x + '"]', line: 'main .code [data-line="' + sel.n + '"]'}[sel.kind];
  for (const e of document.querySelectorAll(q)) e.classList.add(sel.kind === 'reg' ? 'hl' : 'sel');
  if (sel.kind === 'row' && sel.off) for (const e of document.querySelectorAll(
    'main tr[data-i="' + sel.i + '"] .slot')) e.classList.add('hl');
}

function panel() {
  const v = state.view;
  let h;
  if (sel && sel.kind === 'reg') h = panelReg(sel.r);
  else if (sel && sel.kind === 'row' && v === 'cmp') h = panelRow(sel.i);
  else if (sel && sel.kind === 'insn' && v === 'pass') h = panelInsn(sel.u);
  else if (sel && sel.kind === 'expr' && v === 'pass') h = panelExpr(sel.x);
  else if (sel && sel.kind === 'line' && v === 'c') h = panelLine(sel.n);
  else h = v === 'cmp' ? panelCmp() : v === 'pass' ? panelPass() : '<h2>' + esc(D.src) + '</h2>' +
    '<p class="faint">Clic en una línea de la función para ver su asm.</p>';
  $('side').innerHTML = h;
  hl();
}

function pick(s) { sel = s; panel(); }

function renderNav() {
  const v = state.view;
  let h = '';
  if (v === 'cmp') {
    h = '<label><input type="checkbox" id="only"' + (state.only ? ' checked' : '') + '> sólo cambios</label>';
    if (D.sides.length > 1) h += '<select id="vs">' + D.sides.map(s => '<option' +
      (s === otherSide() ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select>';
  }
  if (v === 'pass') h = '<button data-step="-1" title="pasada anterior">‹</button><select id="pass">' +
    D.passes.map(p => '<option' + (p === state.pass ? ' selected' : '') + '>' + esc(p) + '</option>').join('') +
    '</select><button data-step="1" title="pasada siguiente">›</button>' +
    (state.pass === 'gcse' ? '<span class="tabs"><button data-table="0"' + (state.table ? '' : ' class="on"') +
      '>código</button><button data-table="1"' + (state.table ? ' class="on"' : '') +
      '>tabla de cuentas</button></span>' : '');
  $('nav').innerHTML = h;
  for (const b of $('tabs').querySelectorAll('button')) b.classList.toggle('on', b.dataset.v === v);
}

function render() {
  const v = state.view;
  $('main').innerHTML = v === 'cmp' ? viewCmp() : v !== 'pass' ? viewC() :
    state.pass === 'gcse' && state.table ? viewTable() : viewPass();
  renderNav();
  panel();
  fitHeader();
}

const hdr = () => document.querySelector('header').offsetHeight;
function fitHeader() { document.documentElement.style.setProperty('--hdr', hdr() + 'px'); }
addEventListener('resize', fitHeader);
const show = e => e && (e.scrollIntoView({block: 'center'}));

function topLine() {
  for (const e of document.querySelectorAll('main .src'))
    if (e.getBoundingClientRect().top > hdr()) return e.dataset.line;
  return null;
}

function setView(v, keep) {
  // Moving between passes keeps the same C line in view.
  const line = state.view === 'pass' && v === 'pass' ? topLine() : null;
  state.view = v; save();
  if (!keep) sel = null;
  render();
  if (line) {
    const e = document.querySelector('main .src[data-line="' + line + '"]');
    if (e) e.scrollIntoView({block: 'start'}), window.scrollBy(0, -hdr() - 4);
  } else if (v === 'c') show($('fstart'));
  else scrollTo(0, 0);
}

function setPass(p) { state.pass = p; setView('pass', sel && sel.kind === 'reg'); }

$('file').textContent = D.src;
$('file').title = D.flags;
for (const f of D.funcs) $('func').add(new Option(f, f));
for (const [v, label] of [['cmp', 'Comparar'], ['pass', 'Pasadas'], ['c', 'C']]) {
  const b = document.createElement('button');
  b.textContent = label; b.dataset.v = v; b.onclick = () => setView(v);
  $('tabs').appendChild(b);
}
// "report.html?view=gcse&func=BuildReachMap" opens straight there.
const q = new URLSearchParams(location.search);
if (q.get('view')) state.view = q.get('view');
if (q.get('pass')) state.pass = q.get('pass');
if (q.get('table')) state.table = q.get('table') === '1';
if (q.get('func')) state.func = q.get('func');
else if (D.start && !q.get('view')) state.func = D.start;
if (D.passes.includes(state.view)) [state.pass, state.view] = [state.view, 'pass'];
if (!['cmp', 'pass', 'c'].includes(state.view)) state.view = 'cmp';
if (!D.passes.includes(state.pass)) state.pass = D.passes.includes('gcse') ? 'gcse' : D.passes[0];
if (!D.funcs.includes(state.func)) state.func = D.funcs[D.funcs.length - 1];
$('func').value = state.func;
$('func').onchange = () => { state.func = $('func').value; sel = null; save(); render(); };

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'only') { state.only = t.checked; save(); render(); }
  if (t.id === 'vs') { state.side = t.value; save(); render(); }
  if (t.id === 'pass') setPass(t.value);
});
document.addEventListener('click', e => {
  const t = e.target, at = s => t.closest(s);
  let a;
  if ((a = at('[data-table]'))) { state.table = a.dataset.table === '1'; setView('pass'); }
  else if ((a = at('[data-step]'))) {
    const k = D.passes.indexOf(state.pass) + +a.dataset.step;
    if (k >= 0 && k < D.passes.length) setPass(D.passes[k]);
  } else if (at('[data-clear]')) pick(null);
  else if ((a = at('[data-see]'))) {
    state.pass = 'gcse'; sel = {kind: 'reg', r: a.dataset.see}; setView('pass', true);
    show(document.querySelector('main .r[data-r="' + a.dataset.see + '"]'));
  } else if (at('[data-next]')) {
    const us = [...document.querySelectorAll('main .r.hl')];
    const k = us.findIndex(u => u.getBoundingClientRect().top > innerHeight / 2 + 4);
    show(us[k < 0 ? 0 : k]);
  } else if ((a = at('a.lab'))) {
    e.preventDefault();
    for (const x of document.querySelectorAll('.target')) x.classList.remove('target');
    const x = document.querySelector(a.getAttribute('href'));
    if (x) x.classList.add('target'), show(x);
  } else if ((a = at('[data-r]'))) pick(sel && sel.kind === 'reg' && sel.r === a.dataset.r ? null :
    {kind: 'reg', r: a.dataset.r});
  else if ((a = at('tr[data-i]'))) {
    const s = {kind: 'row', i: +a.dataset.i, off: !!at('.slot')};
    if (state.view !== 'cmp' || !at('main')) {
      if (state.view !== 'cmp') setView('cmp');
      pick(s); show(document.querySelector('main tr[data-i="' + s.i + '"]'));
    } else pick(s);
  } else if ((a = at('main [data-u]'))) pick({kind: 'insn', u: a.dataset.u});
  else if ((a = at('main [data-x]'))) pick({kind: 'expr', x: a.dataset.x});
  else if ((a = at('main .code .row.fn'))) pick({kind: 'line', n: +a.dataset.line});
});
render();
if (state.view === 'c') show($('fstart'));
</script>
</body>
</html>
